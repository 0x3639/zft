name: Validate isolated shielded candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shielded-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir research/shielded-lab --ignore-workspace install --frozen-lockfile --ignore-scripts
      - run: node research/shielded-lab/scripts/bootstrap.mjs
      - run: pnpm --dir research/shielded-lab --ignore-workspace build:circuits
      # Disposable CI setup only; never export proving/setup material as a deployment candidate.
      - run: node research/shielded-lab/scripts/setup.mjs create groth16
      - run: node research/shielded-lab/scripts/setup.mjs spend groth16
      - run: node research/shielded-lab/scripts/build-contracts.mjs --groth16-only
      - run: pnpm --dir research/shielded-lab --ignore-workspace test
      - run: node research/shielded-lab/scripts/check-circuit-controls.mjs
      - run: node research/shielded-lab/scripts/check-state-controls.mjs
      - run: node research/shielded-lab/scripts/build-client.mjs
      - name: Validate shielded app integration
        run: node --import tsx --test --test-concurrency=1 research/shielded-app/test/*.test.mjs
      - run: node research/shielded-app/check-controls.mjs
      - run: node research/shielded-app/check-builds.mjs
      - name: Validate devnet runner offline boundaries
        run: node --test research/shielded-devnet/*.test.mjs
