name: Validate devnet app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # App wallet interoperability tests import the isolated PS verifier.
      - run: pnpm --dir research/ps-lab --ignore-workspace install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec tsx research/ps-lab/check-image-codec.ts
      - run: pnpm test
      - run: node scripts/check-ps-product-controls.mjs
      - run: pnpm ps:release-test
      - run: pnpm contracts:build
      - run: pnpm contracts:test
      - run: pnpm build
      - run: pnpm worker:check
      - run: node scripts/check-og-renderer.mjs
  ps-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pnpm --dir research/ps-lab --ignore-workspace install --frozen-lockfile --ignore-scripts
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r research/ps-lab/requirements.txt
      - run: python research/ps-lab/check-inventory.py
      - run: python research/ps-lab/generate.py
      - run: pnpm --dir research/ps-lab --ignore-workspace test
      - run: node research/ps-lab/check-controls.mjs
      - run: pnpm --dir research/ps-lab --ignore-workspace test:local
      - run: node research/ps-lab/local/check-controls.mjs
      - run: pnpm --dir research/ps-lab --ignore-workspace test:service
      - run: pnpm --dir research/ps-lab --ignore-workspace test:service-controls
